<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeSync — 개인 일정 관리 프로토타입</title>
<style>
  :root{
    color-scheme:light;
    --ground:#efeaf3; --surface:#ffffff; --surface-2:#ffffff; --surface-sunk:#f5f1f8;
    --border:#ebe6ee; --border-strong:#dad0e2;
    --text:#250835; --text-2:#473054; --text-3:#6a5b72;
    --accent:#ab2fed; --accent-soft:#efe4fc; --accent-ink:#7a26b8; --primary:#250835;
    --today:#4b38ee; --today-soft:#e7e3fd;
    --done:#2f9e6a; --overdue:#cf4436;
    --cat-work:#0283ec; --cat-exercise:#2f9e6a; --cat-life:#4b38ee; --cat-hobby:#ab2fed; --cat-study:#e0932f; --cat-social:#e0559e; --cat-couple:#d6336c;
    --shadow:0 1px 2px rgba(37,8,53,.05),0 16px 32px rgba(37,8,53,.08);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --r:14px; --r-sm:10px; --hourH:54px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      color-scheme:dark;
      --ground:#140a1d; --surface:#1d1029; --surface-2:#261634; --surface-sunk:#140a1d;
      --border:#38294a; --border-strong:#4b3a60;
      --text:#f2ecf7; --text-2:#c9bbd6; --text-3:#9585a6;
      --accent:#c77dff; --accent-soft:#38214f; --accent-ink:#e6ccff; --primary:#7c3aed;
      --today:#8b78ff; --today-soft:#2a2350; --done:#4fbf86; --overdue:#f0715a;
      --cat-work:#6ba8f5; --cat-exercise:#4fbf86; --cat-life:#8b78ff; --cat-hobby:#c77dff; --cat-study:#f0b45c; --cat-social:#f07bb8; --cat-couple:#f06a9a;
      --shadow:0 1px 2px rgba(0,0,0,.35),0 16px 32px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="light"]{
    color-scheme:light;
    --ground:#efeaf3; --surface:#ffffff; --surface-2:#ffffff; --surface-sunk:#f5f1f8;
    --border:#ebe6ee; --border-strong:#dad0e2;
    --text:#250835; --text-2:#473054; --text-3:#6a5b72;
    --accent:#ab2fed; --accent-soft:#efe4fc; --accent-ink:#7a26b8; --primary:#250835;
    --today:#4b38ee; --today-soft:#e7e3fd; --done:#2f9e6a; --overdue:#cf4436;
    --cat-work:#0283ec; --cat-exercise:#2f9e6a; --cat-life:#4b38ee; --cat-hobby:#ab2fed; --cat-study:#e0932f; --cat-social:#e0559e; --cat-couple:#d6336c;
    --shadow:0 1px 2px rgba(37,8,53,.05),0 16px 32px rgba(37,8,53,.08);
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ground:#140a1d; --surface:#1d1029; --surface-2:#261634; --surface-sunk:#140a1d;
    --border:#38294a; --border-strong:#4b3a60;
    --text:#f2ecf7; --text-2:#c9bbd6; --text-3:#9585a6;
    --accent:#c77dff; --accent-soft:#38214f; --accent-ink:#e6ccff; --primary:#7c3aed;
    --today:#8b78ff; --today-soft:#2a2350; --done:#4fbf86; --overdue:#f0715a;
    --cat-work:#6ba8f5; --cat-exercise:#4fbf86; --cat-life:#8b78ff; --cat-hobby:#c77dff; --cat-study:#f0b45c; --cat-social:#f07bb8; --cat-couple:#f06a9a;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 16px 32px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.45;}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  ::selection{background:var(--accent-soft)}

  /* 반응형: 아이폰17·아이패드미니5 = 화면 꽉 채움, 데스크톱(>1024) = 가운데 프레임 */
  .app{width:100%;margin:0 auto;min-height:100dvh;background:var(--surface);display:flex;flex-direction:column;position:relative}
  @media (min-width:1025px){ .app{max-width:560px;border-left:1px solid var(--border);border-right:1px solid var(--border)} }

  .topbar{flex:0 0 auto;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:calc(14px + env(safe-area-inset-top)) 18px 10px;}
  .topbar .brand{display:flex;align-items:center;justify-content:space-between}
  .brand .logo{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:.02em}
  .brand .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);display:grid;place-items:center;color:var(--text-2);transition:.15s}
  .icon-btn:hover{color:var(--text);border-color:var(--border-strong)}
  #notifDot{position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--overdue);border:2px solid var(--surface)}
  .ibitem{display:flex;align-items:center;gap:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:8px;width:100%;text-align:left}
  .ibitem.read{opacity:.5}
  .ibitem .ibic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;flex:0 0 auto;background:var(--accent-soft);color:var(--accent-ink)}
  .ibitem .ibt{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ibitem .ibs{font-size:11.5px;color:var(--text-3);margin-top:1px}
  .ibitem .ibdot{width:8px;height:8px;border-radius:50%;background:var(--overdue);margin-left:auto;flex:0 0 auto}
  .ibitem.over{border-color:var(--overdue);background:color-mix(in srgb, var(--overdue) 7%, var(--surface-2))}
  .ibitem.over .ibs{color:var(--overdue);font-weight:600}
  .topbar h1{margin:8px 0 0;font-size:23px;font-weight:700;letter-spacing:-.02em}
  .topbar .sub{display:none}
  .syncstat{font-size:10px;font-weight:700;vertical-align:middle;margin-left:6px;padding:2px 8px;border-radius:20px;white-space:nowrap}
  .syncstat.ok{color:var(--done);background:color-mix(in srgb,var(--done) 13%,transparent)}
  .syncstat.sy{color:var(--text-3);background:var(--surface-sunk)}
  .syncstat.off{color:var(--overdue);background:color-mix(in srgb,var(--overdue) 13%,transparent)}

  .screen{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 100px}
  .view{display:none;animation:fade .22s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.view.active{animation:none}}

  .seg{display:inline-flex;background:var(--surface-sunk);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--text-2);font-size:13px;font-weight:600;padding:6px 14px;border-radius:8px;transition:.15s}
  .seg button.on{background:var(--surface-2);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}

  .calnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
  .calnav-label{font-size:14.5px;font-weight:650;font-variant-numeric:tabular-nums;text-align:center;flex:1}
  .navbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font-size:19px;line-height:1;display:grid;place-items:center;flex:0 0 auto}
  .navbtn:hover{color:var(--text);border-color:var(--border-strong)}
  .daysum{display:flex;align-items:center;gap:8px;margin:10px 0 0;padding:9px 12px;background:var(--accent-soft);border:1px solid var(--border);border-radius:12px;font-size:12.5px}
  .daysum .ds-badge{font-weight:800;color:#fff;background:var(--accent);border-radius:7px;padding:2px 8px;font-size:11.5px;flex:0 0 auto}
  .daysum .ds-cnt{font-weight:700;color:var(--text-2);flex:0 0 auto}
  .daysum .ds-next{color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .todaybtn{border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);border-radius:9px;padding:0 12px;height:34px;font-size:12.5px;font-weight:600}
  .todaybtn:hover{color:var(--text)}

  .weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0 6px}
  .daychip{border:1px solid var(--border);background:var(--surface-2);border-radius:12px;padding:8px 0 9px;text-align:center;transition:.15s}
  .daychip .dow{font-size:11px;color:var(--text-3);font-weight:600}
  .daychip .dnum{font-size:16px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
  .daychip .pip{width:5px;height:5px;border-radius:50%;background:var(--accent);margin:4px auto 0;opacity:0}
  .daychip.has .pip{opacity:1}
  .daychip.sel{background:var(--accent);border-color:var(--accent)}
  .daychip.sel .dow,.daychip.sel .dnum{color:#fff}
  .daychip.sel .pip{background:#fff}
  .daychip.today .dnum{color:var(--today)}
  .daychip.today.sel .dnum{color:#fff}

  .allday{display:flex;flex-direction:column;gap:5px;margin-top:12px}
  .aday{display:flex;align-items:center;gap:8px;border-radius:10px;padding:9px 12px;color:#fff;font-size:12.5px;font-weight:650;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .aday .adt{font-size:10.5px;opacity:.92;margin-left:auto;font-weight:500;white-space:nowrap}

  .timeline{position:relative;margin-top:12px;border-radius:var(--r);overflow-y:auto;max-height:56vh;border:1px solid var(--border);background:var(--surface-2)}
  .tl-grid{position:relative}
  .hour{height:var(--hourH);border-top:1px solid var(--border);position:relative}
  .hour:first-child{border-top:0}
  .hour .lbl{position:absolute;left:8px;top:-8px;font-size:11px;color:var(--text-3);background:var(--surface-2);padding:0 4px;font-variant-numeric:tabular-nums}
  .tl-blocks{position:absolute;inset:0;left:52px;right:8px}
  .block{position:absolute;left:0;right:0;border-radius:9px;padding:6px 9px;overflow:hidden;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);cursor:pointer;border-left:3px solid rgba(255,255,255,.5)}
  .block .bt{font-size:12.5px;font-weight:650;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .block .btime{font-size:10.5px;opacity:.92;font-variant-numeric:tabular-nums}
  .nowline{position:absolute;left:44px;right:0;height:2px;background:var(--overdue);z-index:5}
  .nowline::before{content:"";position:absolute;left:-5px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--overdue)}

  .month{margin-top:12px}
  .month .mhead{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
  .month .mhead span{text-align:center;font-size:11px;color:var(--text-3);font-weight:600}
  .month .mgrid{display:flex;flex-direction:column;gap:10px}
  .mweek{position:relative}
  .mweek-head{display:grid;grid-template-columns:repeat(7,1fr)}
  .mdayhead{display:flex;flex-direction:column;align-items:center;gap:1px;padding-top:2px;cursor:pointer;border-radius:8px}
  .mdayhead.dim{opacity:.32}
  .mdayhead .dn{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
  .mdayhead.today .dn{background:var(--today);color:#fff}
  .mdayhead.sel .dn{box-shadow:0 0 0 2px var(--accent)}
  .mdayhead .tdc{font-size:9px;color:var(--text-3);font-weight:700;line-height:1;min-height:10px}
  .mbars{position:relative;margin-top:3px;min-height:74px}
  .mbar{position:absolute;height:19px;border-radius:5px;color:#fff;font-size:10.5px;font-weight:650;line-height:19px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;cursor:grab;touch-action:pan-y;box-shadow:0 1px 2px rgba(0,0,0,.14)}
  .drophi{position:fixed;z-index:190;border:2px dashed var(--accent);background:var(--accent-soft);border-radius:8px;pointer-events:none;opacity:.55}
  .monthline{margin-top:14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:13px 15px;display:flex;align-items:center;gap:8px}
  .monthline .ml-d{font-size:13.5px;font-weight:650}
  .monthline .ml-n{margin-left:auto;font-size:12.5px;color:var(--accent);font-weight:700}
  #v-habit .calnav{margin:2px 0 16px}
  .colsw{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;outline:2px solid transparent;outline-offset:2px}
  .colsw.on{outline-color:var(--text)}
  .sheet.tall{max-height:94vh}
  .noteToolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .ntbtn{border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:600}
  .ntbtn:hover{color:var(--text);border-color:var(--border-strong)}
  .noteEditor{height:38vh;border:1px solid var(--border);border-radius:12px;padding:13px;font-size:15px;line-height:1.65;outline:none;overflow-y:auto;background:var(--surface-2);color:var(--text)}
  .noteEditor:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .noteEditor:empty:before{content:attr(data-ph);color:var(--text-3)}
  .noteEditor h2{font-size:19px;font-weight:800;margin:.5em 0 .2em}
  .noteEditor h3{font-size:16px;font-weight:700;margin:.5em 0 .2em}
  .noteEditor .ckb{cursor:pointer;user-select:none;font-size:16px}
  .emojibar{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;padding:8px;background:var(--surface-sunk);border-radius:10px}
  .emojibar button{font-size:20px;background:none;border:0;padding:4px;border-radius:6px;line-height:1}
  .emojibar button:hover{background:var(--surface-2)}
  .newfolder{display:flex;align-items:center;gap:8px;background:none;border:1px dashed var(--border-strong);color:var(--text-2);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;width:100%;margin-bottom:10px}
  .newfolder:hover{color:var(--accent);border-color:var(--accent)}
  .noteview h2{font-size:19px;font-weight:800;margin:.5em 0 .2em}
  .noteview h3{font-size:16px;font-weight:700;margin:.5em 0 .2em}
  .noteview .ckb{font-size:16px}
  .detail-body.noteview{max-height:52vh;overflow-y:auto}
  .noteEditor ul,.noteview ul{padding-left:22px;margin:.3em 0;list-style:disc}
  .noteEditor ol,.noteview ol{padding-left:22px;margin:.3em 0;list-style:decimal}
  .drawtools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
  .pensw{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);cursor:pointer;padding:0;flex:0 0 auto}
  .pensw.on{outline:2px solid var(--text);outline-offset:2px}
  .drawtools .btn{flex:0 0 auto;width:auto;padding:6px 12px;font-size:12.5px}
  .szbtn{border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;flex:0 0 auto}
  .szbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .drawwrap{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;touch-action:none}
  .drawwrap canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
  .rec{display:flex;align-items:center;gap:14px}
  .rectime{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-2)}
  #a_recBtn{flex:0 0 auto;width:auto;padding:11px 18px}

  .sec-h{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);margin:22px 4px 10px}

  .todo{display:flex;align-items:flex-start;gap:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 13px;margin-bottom:8px;transition:.15s}
  .check{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:2px solid var(--border-strong);background:transparent;margin-top:1px;display:grid;place-items:center;transition:.15s}
  .check svg{opacity:0;transform:scale(.5);transition:.15s}
  .todo.done .check{background:var(--done);border-color:var(--done)}
  .todo.done .check svg{opacity:1;transform:none}
  .todo .tbody{flex:1;min-width:0}
  .todo .ttitle{font-size:14.5px;font-weight:550}
  .todo.done .ttitle{color:var(--text-3);text-decoration:line-through}
  .todo .tmeta{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
  .qtag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.02em}
  .ntag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--surface-sunk);color:var(--text-3)}
  .q1{background:#fdeae6;color:#b23a26} .q2{background:var(--accent-soft);color:var(--accent-ink)}
  .q3{background:#fdf0da;color:#9a6516} .q4{background:var(--surface-sunk);color:var(--text-3)}
  @media (prefers-color-scheme:dark){ .q1{background:#3a1e18;color:#f0715a} .q3{background:#33280f;color:#f0b45c} }
  :root[data-theme="dark"] .q1{background:#3a1e18;color:#f0715a}
  :root[data-theme="dark"] .q3{background:#33280f;color:#f0b45c}
  :root[data-theme="light"] .q1{background:#fdeae6;color:#b23a26}
  :root[data-theme="light"] .q3{background:#fdf0da;color:#9a6516}
  .tdel{margin-left:auto;color:var(--text-3);background:none;border:0;font-size:18px;line-height:1;padding:2px 4px;opacity:.6}
  .tdel:hover{opacity:1;color:var(--overdue)}

  .matrix{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}
  .quad{border:1px solid var(--border);border-radius:16px;background:var(--surface-2);padding:14px 12px 12px;min-height:230px;display:flex;flex-direction:column}
  .quad.qq1{--qc:var(--overdue)} .quad.qq2{--qc:var(--accent)} .quad.qq3{--qc:var(--today)} .quad.qq4{--qc:var(--text-3)}
  .quad .qtop{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:12px}
  .quad h4{margin:0;font-size:13.5px;font-weight:700}
  .quad .qn{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .qlist{display:flex;flex-direction:column;gap:8px;overflow-y:auto}
  .qitem{display:flex;align-items:flex-start;gap:9px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:10px 11px;cursor:pointer;transition:.12s}
  .qitem:active{transform:scale(.99)}
  .qitem .qdot{width:8px;height:8px;border-radius:50%;background:var(--qc);flex:0 0 auto;margin-top:5px}
  .qitem .qmain{flex:1;min-width:0;display:flex;flex-direction:column}
  .qitem .qtext{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .latetag{align-self:flex-start;font-size:9.5px;font-weight:700;color:var(--overdue);background:rgba(210,80,60,.13);padding:1px 6px;border-radius:20px;margin-top:4px}
  .qitem .qcheck{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:2px solid var(--border-strong);background:transparent;display:grid;place-items:center;margin-top:0;transition:.12s}
  .qitem .qcheck svg{opacity:0;transition:.12s}
  .qitem.done .qcheck{background:var(--done);border-color:var(--done)}
  .qitem.done .qcheck svg{opacity:1}
  .qitem.done .qdot{background:var(--done)}
  .qitem.done .qtext{text-decoration:line-through;color:var(--text-3)}
  .qempty{font-size:11px;color:var(--text-3);opacity:.55;padding:2px}

  .habit{border-radius:16px;padding:14px 15px 14px;margin-bottom:10px;color:#fff;--hc:#ab2fed;box-shadow:0 6px 18px rgba(37,8,53,.16)}
  .hrow1{display:flex;align-items:center;gap:7px}
  .hfire{font-size:21px;line-height:1;flex:0 0 auto}
  .hstreak{font-size:25px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .hname{font-size:18px;font-weight:700;margin-left:3px;line-height:1.1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ================= HIGH-FIDELITY CLAYMORPHISM SKIN · 색감·그림자 참고 적용 ================= */
:root,:root[data-theme="light"],:root[data-theme="dark"]{
  --ground:#F4F1FA;--surface:#F4F1FA;--surface-2:#FCFBFF;--surface-sunk:#EDEAF5;
  --border:transparent;--border-strong:rgba(124,58,237,.18);
  --text:#332F3A;--text-2:#4A4551;--text-3:#635F69;
  --accent:#7C3AED;--accent-soft:#ece7fe;--accent-ink:#6d28d9;--primary:#7C3AED;
  --today:#0EA5E9;--today-soft:#e0f2fe;--done:#10B981;--overdue:#F43F6B;
  --shadow:16px 16px 32px rgba(160,150,180,.20),-10px -10px 24px rgba(255,255,255,.9);
  --r:26px;--r-sm:18px;
  --clay-card:16px 16px 32px rgba(160,150,180,.20),-10px -10px 24px rgba(255,255,255,.9),inset 6px 6px 12px rgba(139,92,246,.03),inset -6px -6px 12px rgba(255,255,255,1);
  --clay-sm:8px 8px 18px rgba(160,150,180,.22),-6px -6px 14px rgba(255,255,255,.92);
  --clay-hover:20px 20px 40px rgba(160,150,180,.28),-12px -12px 28px rgba(255,255,255,.95);
  --clay-btn:10px 10px 22px rgba(124,58,237,.32),-7px -7px 15px rgba(255,255,255,.5),inset 3px 3px 7px rgba(255,255,255,.35),inset -4px -4px 8px rgba(60,20,120,.18);
  --clay-press:inset 8px 8px 16px #d7d1e6,inset -8px -8px 16px #ffffff;
  --clay-press-sm:inset 4px 4px 9px #d7d1e6,inset -4px -4px 9px #ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--ground:#F4F1FA;--surface:#F4F1FA;--surface-2:#FCFBFF;--surface-sunk:#EDEAF5;--border:transparent;--text:#332F3A;--text-2:#4A4551;--text-3:#635F69;--accent:#7C3AED;--primary:#7C3AED;color-scheme:light;}}

body{background:#F4F1FA;font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:500}
h1,h2,h3,.topbar h1,.lg-h,.sheet h3,.dnum,.hstreak{font-family:"Nunito","DM Sans",sans-serif;font-weight:800;letter-spacing:-.01em}

/* 배경 블롭 */
.clay-blobs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.clay-blobs .cb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.clay-blobs .cb1{width:60vh;height:60vh;background:#c4b5fd;top:-12%;left:-10%;animation:clayfloat 12s ease-in-out infinite}
.clay-blobs .cb2{width:55vh;height:55vh;background:#fbcfe8;top:15%;right:-12%;animation:clayfloat 10s ease-in-out infinite 1.5s}
.clay-blobs .cb3{width:50vh;height:50vh;background:#bae6fd;bottom:-14%;left:20%;animation:clayfloat 14s ease-in-out infinite .8s}
@keyframes clayfloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(4deg)}}
.app{position:relative;z-index:1;background:transparent!important;border-left:none!important;border-right:none!important}
@media (min-width:1025px){.app{box-shadow:none}}
.screen{background:transparent}

/* 상단바 / GNB (하단 유지) */
.topbar{background:rgba(244,241,250,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:none}
.gnb{background:rgba(244,241,250,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:none;box-shadow:0 -10px 24px -16px rgba(124,58,237,.35)}
.icon-btn{background:var(--surface-2);box-shadow:var(--clay-sm);border-radius:16px;transition:.25s}
.icon-btn:hover{transform:translateY(-1px);box-shadow:var(--clay-hover)}
.icon-btn:active{box-shadow:var(--clay-press-sm)}

/* 카드류 (떠있는 클레이) */
.todo,.quad,.qitem,.ibitem,.choice,.folder-card,.daysum,.gd-head,.gd-item,.notif{background:var(--surface-2)!important;box-shadow:var(--clay-sm)!important;border:none!important;border-radius:22px;transition:transform .35s ease,box-shadow .35s ease}
.todo:hover,.folder-card:hover,.choice:hover,.qitem:hover{transform:translateY(-3px);box-shadow:var(--clay-hover)!important}
.gd-body{background:var(--surface-2)!important;box-shadow:none;border:none}
.newfolder{background:var(--surface-2)!important;box-shadow:var(--clay-press-sm);border:none!important;border-radius:18px}

/* 아이젠하워 배경색 구분 (사분면) */
.todo.qq1{--qc:var(--overdue)} .todo.qq2{--qc:var(--accent)} .todo.qq3{--qc:var(--today)} .todo.qq4{--qc:var(--text-3)}
.todo.qq1,.todo.qq2,.todo.qq3,.todo.qq4{background:color-mix(in srgb, var(--qc) 9%, #FCFBFF)!important}
.quad.qq1{background:color-mix(in srgb, var(--overdue) 10%, #FCFBFF)!important}
.quad.qq2{background:color-mix(in srgb, var(--accent) 10%, #FCFBFF)!important}
.quad.qq3{background:color-mix(in srgb, var(--today) 10%, #FCFBFF)!important}
.quad.qq4{background:color-mix(in srgb, var(--text-3) 10%, #FCFBFF)!important}
.quad{box-shadow:var(--clay-sm)!important;border:none!important;border-radius:24px}

/* 세그 / pill / 칩 / 데이칩 */
.seg{background:var(--surface-sunk);box-shadow:var(--clay-press-sm);border:none!important;border-radius:18px}
.seg button.on{background:var(--surface-2);box-shadow:var(--clay-sm);border-radius:13px}
.pill{background:var(--surface-2);box-shadow:var(--clay-sm);border:none!important}
.pill.on{background:var(--surface-2);box-shadow:var(--clay-press-sm);color:var(--accent)}
.catchip,.catpick,.hblvbtn{background:var(--surface-2);box-shadow:var(--clay-sm);border:none!important}
.catchip.on,.catpick.on,.hblvbtn.on{box-shadow:var(--clay-press-sm)}
.daychip{background:var(--surface-2)!important;box-shadow:var(--clay-sm);border:none!important;border-radius:18px;transition:.25s}
.daychip.sel{box-shadow:var(--clay-press);background:var(--surface-2)!important}
.daychip.sel .dow,.daychip.sel .dnum{color:var(--accent)!important}
.daychip.sel .pip{background:var(--accent)!important}
.navbtn,.todaybtn{background:var(--surface-2)!important;box-shadow:var(--clay-sm);border:none!important;border-radius:16px}
.navbtn:active,.todaybtn:active{box-shadow:var(--clay-press-sm)}

/* 버튼 */
.btn{background:var(--surface-2)!important;box-shadow:var(--clay-sm);border:none!important;border-radius:18px;color:var(--text)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--clay-hover)}
.btn:active{transform:scale(.96);box-shadow:var(--clay-press-sm)}
.btn.primary{background:linear-gradient(135deg,#A78BFA,#7C3AED)!important;color:#fff;box-shadow:var(--clay-btn)}
.btn.primary:active{box-shadow:var(--clay-press-sm)}
.btn.danger{color:#e0384f}

/* 입력 = 눌린 클레이 */
.field input,.field select,.field textarea{background:#EFEBF7!important;box-shadow:var(--clay-press);border:none!important;border-radius:18px;color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{background:#fff!important;box-shadow:var(--clay-press),0 0 0 2px #F4F1FA,0 0 0 5px rgba(124,58,237,.35)!important}

/* 아이콘 웰 */
.ibitem .ibic,.folder-card .fic,.chic{box-shadow:var(--clay-press-sm);border:none}

/* 타임라인 = 파인 클레이 */
.timeline{background:var(--surface-sunk)!important;box-shadow:var(--clay-press)!important;border:none!important;border-radius:22px}

/* 바텀시트 */
.sheet{background:#F4F1FA!important;border-radius:34px 34px 0 0;box-shadow:0 -16px 40px -8px rgba(124,58,237,.28)}
.grab{background:var(--border-strong)}
.scrim{background:rgba(80,60,120,.28)}

/* FAB */
.fab{background:linear-gradient(135deg,#A78BFA,#7C3AED)!important;box-shadow:var(--clay-btn)!important;border-radius:22px}
.fab:hover{transform:translateY(-2px)}
.fab:active{transform:scale(.94);box-shadow:var(--clay-press)!important}
/* PC(넓은 화면): + 버튼을 우측(콘텐츠 오른쪽 아래)으로 — 폰과 통일 */
@media (min-width:1025px){ .fab{right:max(24px, calc(50% - 574px))!important;left:auto!important} }

/* 기능색 카드는 색 유지 + 클레이 깊이 */
.habit{box-shadow:var(--clay-card)!important;border-radius:28px}
.block,.mbar{box-shadow:6px 6px 14px rgba(120,100,160,.28)!important;border-radius:14px}
.aday{box-shadow:var(--clay-sm)!important;border-radius:16px}

/* 로그인 */
.lg-card{background:var(--surface-2)!important;box-shadow:var(--clay-card)!important;border:none!important;border-radius:34px}
.lg-google{background:var(--surface-2)!important;box-shadow:var(--clay-sm)!important;border:none!important;color:var(--text)!important}

@media (prefers-reduced-motion: reduce){.clay-blobs .cb{animation:none}*{transition:none!important}}

/* ===== 전체보기 (PC/태블릿 3분할 넓은 레이아웃) ===== */
/* 전체 버튼은 PC(>=1200px)에서만 노출 — 폰/아이패드 숨김 */
#calSeg [data-mode="full"]{display:none}
@media (min-width:1200px){ #calSeg [data-mode="full"]{display:block} }
@media (min-width:1200px){
  .app.fullcal{max-width:1180px}
  .fullcal #calBody{display:grid;grid-template-columns:1.15fr 1fr .95fr;grid-template-areas:"month timeline todohead" "month timeline todos";gap:18px;align-items:start;margin-top:12px}
  .fullcal #monthWrap{grid-area:month;display:block!important;margin:0}
  .fullcal #weekWrap{grid-area:timeline;margin:0}
  .fullcal #todoSecH{grid-area:todohead;margin:0 2px 8px}
  .fullcal #dayTodos{grid-area:todos;overflow:auto;max-height:66vh;padding-right:2px}
  .fullcal #weekstrip{display:none}
  .fullcal .timeline{max-height:66vh}
  .fullcal #daySum{margin-top:0}
}

  var SUPA_URL="https://awmciutsqbbqsmgazxhp.supabase.co";
  var SUPA_ANON="sb_publishable_gB4a39RdzazJQrqHl5rBKw_VFm_KiQR";
  var SUPA_ON=false, sb=null, supaUser=null, cloudTimer=null;
  /* =============================================================
     LifeSync 프로토타입 — 개발자 안내 (백엔드 연동 지점)

     • 코드 섹션 순서: 날짜유틸 → defaultGoal/seed/load/save → occursOn(반복 전개)
       → 렌더(renderCal/renderTodo/renderGoal/renderHabit/renderArc)

       → 미디어(idbOpen/idbPut/idbGet/idbDel) → 알림(alerts/updateBadge/openInbox/showNotif)
       → 워치(renderWatch/openWatch: 확인·알림읽음·습관체크·녹음·재생) → 내비(go) → 로그인(getSession/openAccount)

     • 연동 훅: save()→상태 저장 API, load()→상태 로드 API, idbPut/idbGet→Storage,
       getSession()→Auth. 상세는 별첨 PRD/기능명세서 참고.
     ============================================================= */
  var LS=window.localStorage, K="lifesync.v5"; // 상태 저장 키
  var CATS={work:"업무",exercise:"운동",life:"생활",hobby:"취미",study:"학습",social:"약속",couple:"커플"};
  var CATVAR={work:"--cat-work",exercise:"--cat-exercise",life:"--cat-life",hobby:"--cat-hobby",study:"--cat-study",social:"--cat-social",couple:"--cat-couple"};
  var CATHEX={work:"#3B6FE0",exercise:"#3E9B57",life:"#0EA5A0",hobby:"#8B5CF6",study:"#E0932F",social:"#E0655C",couple:"#E0559E"};
  // 카테고리는 이제 사용자 편집 가능(state.cats). 아래는 기본 시드값.
  var DEFAULT_CATS=[
    {id:"work",name:"업무",color:"#3B6FE0"},{id:"exercise",name:"운동",color:"#3E9B57"},
    {id:"life",name:"생활",color:"#0EA5A0"},{id:"hobby",name:"취미",color:"#8B5CF6"},
    {id:"study",name:"학습",color:"#E0932F"},{id:"social",name:"약속",color:"#E0655C"},
    {id:"couple",name:"커플",color:"#E0559E"}
  ];
  var CAT_PALETTE=["#3B6FE0","#3E9B57","#0EA5A0","#8B5CF6","#E0932F","#E0655C","#E0559E","#ab2fed","#4b38ee","#d6336c","#2f9e6a","#473054"];
  function defaultCats(){return DEFAULT_CATS.map(function(c){return {id:c.id,name:c.name,color:c.color};});}
  function catList(){return (state&&state.cats&&state.cats.length)?state.cats:DEFAULT_CATS;}
  function catById(id){var l=catList();for(var i=0;i<l.length;i++){if(l[i].id===id)return l[i];}return {id:id||"",name:(CATS[id]||id||"기타"),color:(CATHEX[id]||"#8a8a8a")};}
  function catColor(id){return catById(id).color;}
  function catName(id){return catById(id).name;}
  var HABIT_COLORS=["#ab2fed","#4b38ee","#0283ec","#2f9e6a","#e0932f","#e0559e","#d6336c","#473054"];
  var LEVELS={mini:"MINI",more:"MORE",max:"MAX"};
  var NOTIFY={off:"안 함",silent:"🔕 무음",sound:"🔔 소리"};
  var QUAD={
    q1:{t:"긴급 · 중요",h:"지금 한다",cls:"q1"},
    q2:{t:"중요 · 안급함",h:"계획한다",cls:"q2"},
    q3:{t:"긴급 · 안중요",h:"위임/빠르게",cls:"q3"},
    q4:{t:"둘 다 아님",h:"버린다",cls:"q4"}
  };
  var DOW=["일","월","화","수","목","금","토"];
  var START_H=5, END_H=28, HOURH=54, START_MIN=300, END_MIN=1680;

  function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
  function pad(n){return (n<10?"0":"")+n;}
  function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
  function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
  function startOfWeek(d){var x=new Date(d);x.setDate(x.getDate()-x.getDay());x.setHours(0,0,0,0);return x;}
  function firstOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);}
  function sameYMD(a,b){return ymd(a)===ymd(b);}
  function mins(t){var p=t.split(":");return (+p[0])*60+(+p[1]);}
  function md(s){var p=s.split("-");return (+p[1])+"/"+(+p[2]);}

  var today=new Date(); today.setHours(0,0,0,0);
  var state=load();
  var ui={view:"cal",calMode:"week",selDate:ymd(today),weekBase:ymd(startOfWeek(today)),monthBase:ymd(firstOfMonth(today)),
    todoMode:"list",todoSort:"start",todoCat:"all",goalSel:"main",arcFilter:"all",arcQ:"",arcFolder:null,habitMonth:ymd(firstOfMonth(today))};

  function load(){try{var s=JSON.parse(LS.getItem(K));if(s&&s.blocks){if(!s.folders){var fs={};s.archive.forEach(function(a){fs[a.folder]=1;});s.folders=Object.keys(fs);}if(!s.readAlerts)s.readAlerts={};if(!s.goal)s.goal=defaultGoal();if(!s.cats||!s.cats.length)s.cats=defaultCats();return s;}}catch(e){} return seed();}
  function save(){LS.setItem(K,JSON.stringify(state));if(typeof updateBadge==="function")updateBadge();if(typeof cloudPush==="function")cloudPush();}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

  function defaultGoal(){return {
    main:{t:"",b:"",done:false},
    subs:[
      {t:"",b:"",done:false,acts:[{t:"",b:"",done:false},{t:"",b:"",done:false},{t:"",b:"",done:false}]},
      {t:"",b:"",done:false,acts:[{t:"",b:"",done:false},{t:"",b:"",done:false},{t:"",b:"",done:false}]},
      {t:"",b:"",done:false,acts:[{t:"",b:"",done:false},{t:"",b:"",done:false},{t:"",b:"",done:false}]}
    ]
  };}
  function seed(){
    // 빈 상태로 시작 (데모 콘텐츠 없음). 카테고리 기본값만 제공.
    return {
      cats:defaultCats(),
      blocks:[],
      todos:[],
      habits:[],
      archive:[],
      folders:[],
      readAlerts:{},
      goal:defaultGoal()
    };
  }
  function seedLevelLog(p){var o={};var start=addDays(today,-95);for(var d=new Date(start);d<=today;d=addDays(d,1)){if(Math.random()<p){var r=Math.random();o[ymd(d)]=r<0.45?"mini":r<0.8?"more":"max";}}return o;}

  // ---------- recurrence / occurrence ----------
  function occursOn(b,d){
    var bd=parse(b.date);
    var rep=(b.repeat&&b.repeat.freq)?b.repeat.freq:"none";
    if(rep==="none"){var ed=b.endDate?parse(b.endDate):bd;return d>=bd&&d<=ed;}
    if(d<bd) return false;
    if(rep==="weekly"){var days=(b.repeat.days&&b.repeat.days.length)?b.repeat.days:[bd.getDay()];return days.indexOf(d.getDay())>=0;}
    if(rep==="monthly") return d.getDate()===bd.getDate();
    if(rep==="yearly") return d.getDate()===bd.getDate()&&d.getMonth()===bd.getMonth();
    return false;
  }
  function isBanner(b){var rep=(b.repeat&&b.repeat.freq)?b.repeat.freq:"none";return !!b.allDay || (rep==="none" && b.endDate && b.endDate!==b.date);}
  function blocksOn(dstr){var d=parse(dstr);return state.blocks.filter(function(b){return occursOn(b,d);}).sort(function(a,b){return mins(a.start||"00:00")-mins(b.start||"00:00");});}
  // 주간 점 표시용: 반복 일정 제외, '그날만의 실제 일정'이 있는지
  function hasRealEvent(dstr){var d=parse(dstr);return state.blocks.some(function(b){return (!b.repeat||b.repeat.freq==="none")&&occursOn(b,d);});}
  function blkIcons(b){var s="";if(b.repeat&&b.repeat.freq&&b.repeat.freq!=="none")s+=" ↻";if(b.notify&&b.notify!=="off")s+=(b.notify==="sound"?" 🔔":" 🔕");return s;}
  function bannerLabel(b){var l=b.allDay?"종일":(b.start+(b.end?"–"+b.end:""));if(b.endDate&&b.endDate!==b.date)l+=" · "+md(b.date)+"–"+md(b.endDate);return l;}
  function clProg(b){var c=b.checklist||[];if(!c.length)return"";var dn=0;c.forEach(function(x){if(x.done)dn++;});return " ✓"+dn+"/"+c.length;}

  // drag-to-move (month view)
  var justDragged=false, hiEl=null;
  function dayFromPoint(x,y){
    var el=document.elementFromPoint(x,y); var wk=(el&&el.closest)?el.closest(".mweek"):null;
    if(!wk||!wk.dataset.start)return null;
    var r=wk.getBoundingClientRect(); var cw=r.width/7; var col=Math.floor((x-r.left)/cw); if(col<0)col=0; if(col>6)col=6;
    return {ds:ymd(addDays(parse(wk.dataset.start),col)), rect:{left:r.left+col*cw, top:r.top, w:cw, h:r.height}};
  }
  function showHi(rect){if(!rect){hideHi();return;}if(!hiEl){hiEl=document.createElement("div");hiEl.className="drophi";document.body.appendChild(hiEl);}hiEl.style.left=(rect.left+1)+"px";hiEl.style.top=(rect.top+1)+"px";hiEl.style.width=(rect.w-2)+"px";hiEl.style.height=(rect.h-2)+"px";}
  function hideHi(){if(hiEl){hiEl.remove();hiEl=null;}}
  function moveBlockDate(b,fromDs,toDs){var delta=Math.round((parse(toDs)-parse(fromDs))/86400000);b.date=ymd(addDays(parse(b.date),delta));if(b.endDate)b.endDate=ymd(addDays(parse(b.endDate),delta));save();toast("일정을 옮겼습니다");}
  function makeDraggable(bar,block,anchorDs){
    bar.style.touchAction="pan-y";
    var lp=null,dragging=false,ghost=null,sx=0,sy=0,tgt=null,pid=null;
    function clearLP(){if(lp){clearTimeout(lp);lp=null;}}
    bar.addEventListener("pointerdown",function(e){if(e.pointerType==="mouse"&&e.button!==0)return;sx=e.clientX;sy=e.clientY;pid=e.pointerId;lp=setTimeout(begin,300);});
    bar.addEventListener("pointermove",function(e){if(!dragging){if(lp&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10))clearLP();return;}e.preventDefault();pos(e.clientX,e.clientY);var r=dayFromPoint(e.clientX,e.clientY);tgt=r?r.ds:null;showHi(r?r.rect:null);});
    bar.addEventListener("pointerup",function(){clearLP();if(!dragging){openBlockSheet(block);return;}finish();});
    bar.addEventListener("pointercancel",function(){clearLP();if(dragging)cleanup();});
    function begin(){dragging=true;try{bar.setPointerCapture(pid);}catch(_){}ghost=bar.cloneNode(true);ghost.style.position="fixed";ghost.style.zIndex="200";ghost.style.pointerEvents="none";ghost.style.width=Math.max(bar.offsetWidth,80)+"px";ghost.style.opacity=".95";ghost.style.transform="scale(1.06)";ghost.style.boxShadow="0 8px 20px rgba(0,0,0,.3)";document.body.appendChild(ghost);pos(sx,sy);bar.style.opacity=".3";if(navigator.vibrate){try{navigator.vibrate(15);}catch(_){}}}
    function pos(x,y){if(ghost){ghost.style.left=(x-ghost.offsetWidth/2)+"px";ghost.style.top=(y-16)+"px";}}
    function finish(){var to=tgt;cleanup();if(to&&to!==anchorDs)moveBlockDate(block,anchorDs,to);justDragged=true;setTimeout(function(){justDragged=false;},350);renderCal();}
    function cleanup(){dragging=false;if(ghost){ghost.remove();ghost=null;}bar.style.opacity="";hideHi();tgt=null;}
  }

  // ---------- CALENDAR ----------
  function renderCal(){
    var full=(ui.calMode==="full");
    var appEl=document.querySelector(".app"); if(appEl)appEl.classList.toggle("fullcal",full);
    if(ui.calMode==="week"||full){
      document.getElementById("weekWrap").style.display="";
      var b=parse(ui.weekBase), e=addDays(b,6);
      if(!full)document.getElementById("calLabel").textContent=(b.getMonth()+1)+"월 "+b.getDate()+"일 – "+(e.getMonth()+1)+"월 "+e.getDate()+"일";
      renderWeekStrip(); renderAllDay(); renderDaySum(); renderTimeline();
    }else{document.getElementById("weekWrap").style.display="none";}
    if(ui.calMode==="month"||full){
      document.getElementById("monthWrap").style.display="";
      var m=parse(ui.monthBase);
      document.getElementById("calLabel").textContent=m.getFullYear()+"년 "+(m.getMonth()+1)+"월";
      renderMonth();
    }else{document.getElementById("monthWrap").style.display="none";}
    var showTodos=(ui.calMode==="week"||full);
    document.getElementById("todoSecH").style.display=showTodos?"":"none";
    document.getElementById("dayTodos").style.display=showTodos?"":"none";
    document.getElementById("monthTodoLine").style.display=(ui.calMode==="month")?"":"none";
    if(showTodos)renderDayTodos(); if(ui.calMode==="month")renderMonthTodoLine();
    document.getElementById("viewTitle").textContent="Calendar ("+ui.selDate.replace(/-/g,".")+")";
  }
  function renderMonthTodoLine(){
    var d=parse(ui.selDate);
    var n=state.todos.filter(function(t){return todoOnDay(t,ui.selDate);}).length;
    var el=document.getElementById("monthTodoLine");
    el.innerHTML='<span class="ml-d">'+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')</span><span class="ml-n">할 일 '+n+'개 ›</span>';
    el.style.cursor="pointer";
    el.onclick=function(){ui.calMode="week";ui.weekBase=ymd(startOfWeek(parse(ui.selDate)));document.querySelectorAll("#calSeg button").forEach(function(x){x.classList.toggle("on",x.getAttribute("data-mode")==="week");});renderCal();};
  }

  function renderWeekStrip(){
    var base=parse(ui.weekBase), el=document.getElementById("weekstrip"); el.innerHTML="";
    for(var i=0;i<7;i++){
      var d=addDays(base,i), ds=ymd(d);
      var real=hasRealEvent(ds);
      var c=document.createElement("button");
      c.className="daychip"+(ds===ui.selDate?" sel":"")+(sameYMD(d,today)?" today":"")+(real?" has":"");
      c.setAttribute("aria-label",(d.getMonth()+1)+"월 "+d.getDate()+"일 "+DOW[d.getDay()]+"요일"+(real?", 일정 있음":"")+(ds===ui.selDate?", 선택됨":""));
      c.innerHTML='<div class="dow">'+DOW[d.getDay()]+'</div><div class="dnum">'+d.getDate()+'</div><div class="pip"></div>';
      (function(ds){c.onclick=function(){ui.selDate=ds;renderCal();};})(ds);
      el.appendChild(c);
    }
  }

  function renderDaySum(){
    var el=document.getElementById("daySum"); if(!el)return;
    var ds=ui.selDate, evs=blocksOn(ds), n=evs.length;
    var td=state.todos.filter(function(t){return todoOnDay(t,ds)&&!t.done;}).length;
    if(!n&&!td){el.style.display="none";el.innerHTML="";return;}
    el.style.display="";
    var isToday=(ds===ymd(today)), right="";
    if(isToday){
      var nm=new Date().getHours()*60+new Date().getMinutes();
      var up=evs.filter(function(b){return !isBanner(b)&&b.start&&mins(b.start)>=nm;})[0];
      right=up?('다음 · '+esc(up.title)+' '+up.start):(n?'남은 일정 없음':'');
    }else{
      right=(evs[0]?('첫 일정 · '+esc(evs[0].title)+(evs[0].start?' '+evs[0].start:'')):'');
    }
    var dd=parse(ds);
    el.innerHTML='<span class="ds-badge">'+(isToday?'오늘':(dd.getMonth()+1)+'/'+dd.getDate())+'</span>'
      +'<span class="ds-cnt">일정 '+n+(td?' · 할일 '+td:'')+'</span>'
      +(right?'<span class="ds-next">'+right+'</span>':'');
  }
  function renderAllDay(){
    var el=document.getElementById("allday");
    var banners=blocksOn(ui.selDate).filter(isBanner);
    if(!banners.length){el.style.display="none";el.innerHTML="";return;}
    el.style.display="";el.innerHTML="";
    banners.forEach(function(b){
      var chip=document.createElement("div"); chip.className="aday"+(((b.endDate||b.date)<ymd(today))?" past":""); chip.style.background=blockColor(b);
      chip.innerHTML='<span>'+esc(b.title)+esc(blkIcons(b))+'</span><span class="adt">'+esc(bannerLabel(b)+clProg(b))+'</span>';
      chip.onclick=function(){openBlockSheet(b);};
      el.appendChild(chip);
    });
  }

  function renderTimeline(){
    var grid=document.getElementById("tlGrid"); grid.innerHTML="";
    for(var h=START_H;h<END_H;h++){
      var row=document.createElement("div"); row.className="hour";
      row.innerHTML='<span class="lbl">'+pad(h%24)+":00</span>";
      grid.appendChild(row);
    }
    var endLbl=document.createElement("div"); endLbl.className="hour"; endLbl.style.height="0";
    endLbl.innerHTML='<span class="lbl">04:00</span>'; grid.appendChild(endLbl);
    var layer=document.createElement("div"); layer.className="tl-blocks"; grid.appendChild(layer);
    // 1) 표시할 시간 블록 수집(자정 넘김/클램프)
    var items=[];
    blocksOn(ui.selDate).filter(function(b){return !isBanner(b);}).forEach(function(b){
      var s=mins(b.start||"09:00"), e=b.end?mins(b.end):s+30;
      if(s<START_MIN){s+=1440;e+=1440;}
      if(e<=s)e+=1440;
      s=Math.max(s,START_MIN); e=Math.min(e,END_MIN);
      if(e<=s) return;
      items.push({b:b,s:s,e:e});
    });
    items.sort(function(a,b){return a.s-b.s||a.e-b.e;});
    // 2) 겹침 클러스터별 컬럼(레인) 배정 → 나란히
    var clusterEnd=-1, cluster=[];
    function flushCluster(){
      if(!cluster.length)return;
      var cols=[];
      cluster.forEach(function(it){var placed=false;for(var ci=0;ci<cols.length;ci++){if(cols[ci]<=it.s){it.col=ci;cols[ci]=it.e;placed=true;break;}}if(!placed){it.col=cols.length;cols.push(it.e);}});
      cluster.forEach(function(it){it.ncol=cols.length;});
      cluster=[];
    }
    items.forEach(function(it){if(cluster.length&&it.s>=clusterEnd){flushCluster();clusterEnd=-1;}cluster.push(it);clusterEnd=Math.max(clusterEnd,it.e);});
    flushCluster();
    // 3) 렌더
    var nowM=(new Date()).getHours()*60+(new Date()).getMinutes();
    items.forEach(function(it){
      var b=it.b, s=it.s, e=it.e;
      var top=(s-START_MIN)/60*HOURH, hgt=(e-s)/60*HOURH-3;
      var isPast=(ui.selDate<ymd(today))||(ui.selDate===ymd(today)&&(b.end?mins(b.end):mins(b.start)+30)<=nowM);
      var hb=habitOf(b), hbDone=hb?!!hb.log[ui.selDate]:false;
      var el=document.createElement("div"); el.className="block"+(isPast?" past":"")+(hb?" hblock":"")+(hb&&hbDone?" hdone":"");
      el.style.top=top+"px"; el.style.height=Math.max(hgt,20)+"px"; el.style.background=blockColor(b);
      var nc=it.ncol||1, col=it.col||0;
      if(nc>1){var wp=100/nc;el.style.left="calc("+(col*wp).toFixed(3)+"% + 1px)";el.style.width="calc("+wp.toFixed(3)+"% - 3px)";el.style.right="auto";}
      var tlabel=b.end?(b.start+"–"+b.end):b.start;
      var mark=hb?('<span class="hbmark">'+(hbDone?"✓":"○")+'</span>'):"";
      el.innerHTML='<div class="bt">'+mark+esc(b.title)+'</div><div class="btime">'+esc(tlabel+blkIcons(b)+clProg(b))+"</div>";
      el.setAttribute("aria-label",(b.title||"일정")+" "+tlabel);
      (function(b,hb){el.onclick=function(){if(hb){openHabitBlockSheet(hb,ui.selDate);}else{openBlockSheet(b);}};})(b,hb);
      layer.appendChild(el);
    });
    if(ui.selDate===ymd(today)){
      var now=new Date(), nm=now.getHours()*60+now.getMinutes();
      if(nm<START_MIN)nm+=1440;
      if(nm>=START_MIN&&nm<=END_MIN){var nl=document.createElement("div"); nl.className="nowline"; nl.style.top=((nm-START_MIN)/60*HOURH)+"px"; grid.appendChild(nl);}
    }
    var tlc=document.querySelector(".timeline");
    if(tlc){var fm=(ui.selDate===ymd(today))?(new Date().getHours()*60+new Date().getMinutes()):8*60; if(fm<START_MIN)fm+=1440; tlc.scrollTop=Math.max(0,(fm-START_MIN)/60*HOURH-90);}
  }

  function buildWeek(wkStart,base){
    var days=[];for(var i=0;i<7;i++)days.push(addDays(wkStart,i));
    var wk=document.createElement("div");wk.className="mweek";wk.dataset.start=ymd(wkStart);
    var head=document.createElement("div");head.className="mweek-head";
    days.forEach(function(d){
      var ds=ymd(d),inM=d.getMonth()===base.getMonth();
      var dh=document.createElement("div");dh.className="mdayhead"+(inM?"":" dim")+(sameYMD(d,today)?" today":"")+(ds===ui.selDate?" sel":"");
      var tc=state.todos.filter(function(t){return todoOnDay(t,ds);}).length;
      dh.innerHTML='<div class="dn">'+d.getDate()+'</div><div class="tdc">'+(tc?"☑"+tc:"&nbsp;")+'</div>';
      dh.onclick=function(){if(justDragged)return;ui.selDate=ds;renderCal();};
      head.appendChild(dh);
    });
    wk.appendChild(head);
    var segs=[];
    state.blocks.forEach(function(b){
      var rep=(b.repeat&&b.repeat.freq)?b.repeat.freq:"none";
      if(rep!=="none"){for(var i=0;i<7;i++){if(occursOn(b,days[i]))segs.push({c0:i,c1:i,b:b});}}
      else{var s=parse(b.date),e=b.endDate?parse(b.endDate):s,c0=-1,c1=-1;for(var i=0;i<7;i++){if(days[i]>=s&&days[i]<=e){if(c0<0)c0=i;c1=i;}}if(c0>=0)segs.push({c0:c0,c1:c1,b:b});}
    });
    segs.sort(function(a,b){if(a.c0!==b.c0)return a.c0-b.c0;return (b.c1-b.c0)-(a.c1-a.c0);});
    var lanes=[];
    segs.forEach(function(sg){
      var li=0;
      for(;li<lanes.length;li++){var ok=true;for(var j=0;j<lanes[li].length;j++){var o=lanes[li][j];if(!(sg.c1<o.c0||sg.c0>o.c1)){ok=false;break;}}if(ok)break;}
      if(li===lanes.length)lanes.push([]);
      lanes[li].push(sg);sg.lane=li;
    });
    var bars=document.createElement("div");bars.className="mbars";bars.style.height=(lanes.length?lanes.length*19:2)+"px";
    segs.forEach(function(sg){
      var b=sg.b;
      var bar=document.createElement("div");bar.className="mbar";bar.style.background=blockColor(b);
      bar.style.left="calc("+(sg.c0/7*100).toFixed(3)+"% + 2px)";
      bar.style.width="calc("+((sg.c1-sg.c0+1)/7*100).toFixed(3)+"% - 4px)";
      bar.style.top=(sg.lane*19)+"px";
      bar.textContent=b.title;
      makeDraggable(bar,b,ymd(days[sg.c0]));
      bars.appendChild(bar);
    });
    wk.appendChild(bars);
    return wk;
  }

  function wireDateTime(prefix){
    wirePills(prefix+"_dtype",function(v){document.getElementById(prefix+"_edate").style.display=(v==="range")?"":"none";});
    wirePills(prefix+"_ttype",function(v){document.getElementById(prefix+"_timeWrap").style.display=(v==="allday"||v==="none")?"none":"";});

  function readDateTime(prefix){
    var dtype=document.querySelector("#"+prefix+"_dtype .on").getAttribute("data-v");
    var ttype=document.querySelector("#"+prefix+"_ttype .on").getAttribute("data-v");
    var date=document.getElementById(prefix+"_date").value;
    var edate=(dtype==="range")?document.getElementById(prefix+"_edate").value:"";
    if(edate&&edate<date){var tmp=edate;edate=date;date=tmp;}
    var allDay=(prefix==="f"&&ttype==="allday");
    var timed=(ttype==="timed");
    var start=(timed)?document.getElementById(prefix+"_start").value:"";
    var end=(timed)?document.getElementById(prefix+"_end").value:"";
    if(prefix==="f"&&!allDay&&!start)start="09:00";
    return {date:date,endDate:edate,allDay:allDay,start:start,end:end};
  }

  // ---------- media store (IndexedDB) ----------
  var mediaDB=null;
  function idbOpen(cb){try{if(mediaDB)return cb(mediaDB);var r=indexedDB.open("lifesync-media",1);r.onupgradeneeded=function(e){e.target.result.createObjectStore("blobs");};r.onsuccess=function(e){mediaDB=e.target.result;cb(mediaDB);};r.onerror=function(){cb(null);};}catch(e){cb(null);}}
  function idbPut(id,blob,cb){
    if(SUPA_ON&&supaUser){sb.storage.from("media").upload(supaUser.id+"/"+id,blob,{upsert:true,contentType:(blob&&blob.type)||"application/octet-stream"}).then(function(res){cb&&cb(!(res&&res.error));}).catch(function(){cb&&cb(false);});return;}
    idbOpen(function(db){if(!db){cb&&cb(false);return;}try{var tx=db.transaction("blobs","readwrite");tx.objectStore("blobs").put(blob,id);tx.oncomplete=function(){cb&&cb(true);};tx.onerror=function(){cb&&cb(false);};}catch(e){cb&&cb(false);}});
  }
  function idbGet(id,cb){
    if(SUPA_ON&&supaUser){sb.storage.from("media").download(supaUser.id+"/"+id).then(function(res){cb((res&&res.data)||null);}).catch(function(){cb(null);});return;}
    idbOpen(function(db){if(!db){cb(null);return;}try{var rq=db.transaction("blobs","readonly").objectStore("blobs").get(id);rq.onsuccess=function(){cb(rq.result||null);};rq.onerror=function(){cb(null);};}catch(e){cb(null);}});
  }

    var penColor="#250835", penBase=4;
    function initCanvas(){

      c.width=W*dpr; c.height=H*dpr; c.style.height=H+"px";
      var ctx=c.getContext("2d"); ctx.scale(dpr,dpr); ctx.lineCap="round"; ctx.lineJoin="round";
      ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,W,H);

      c.addEventListener("pointerdown",function(e){drawing=true;try{c.setPointerCapture(e.pointerId);}catch(_){}var p=pt(e);ctx.beginPath();ctx.moveTo(p.x,p.y);});
      c.addEventListener("pointermove",function(e){if(!drawing)return;e.preventDefault();var p=pt(e);ctx.strokeStyle=penColor;ctx.lineWidth=Math.max(1,(e.pressure||0.6)*penBase*(penColor==="#ffffff"?3:1.4));ctx.lineTo(p.x,p.y);ctx.stroke();});

  function goalNode(ref){var g=state.goal;if(ref.kind==="main")return g.main;if(ref.kind==="sub")return g.subs[ref.ci];return g.subs[ref.ci].acts[ref.ai];}
  function refStr(ref){if(ref.kind==="main")return "main";if(ref.kind==="sub")return "s"+ref.ci;return "s"+ref.ci+"a"+ref.ai;}
  function strToRef(str){if(str==="main")return {kind:"main"};var m=str.match(/^s(\d+)a(\d+)$/);if(m)return {kind:"act",ci:+m[1],ai:+m[2]};var s=str.match(/^s(\d+)$/);if(s)return {kind:"sub",ci:+s[1]};return {kind:"main"};}
  function goalNodeByStr(str){try{return goalNode(strToRef(str));}catch(e){return null;}}
  function goalOptions(sel){
    var g=state.goal||defaultGoal();sel=sel||"";
    function o(v,label){return '<option value="'+v+'"'+(v===sel?" selected":"")+'>'+esc(label)+'</option>';}
    var out='<option value="">연결 안 함</option>'+o("main","🎯 "+(g.main.t||"핵심 목표"));
    g.subs.forEach(function(s,i){out+=o("s"+i,"└ "+(s.t||("세부 "+(i+1))));s.acts.forEach(function(a,j){out+=o("s"+i+"a"+j,"　· "+(a.t||("실행 "+(j+1))));});});
    return out;
  }
  function isBlockDone(b){var end=b.endDate||b.date;var td=ymd(today);if(end<td)return true;if(end===td&&!b.allDay&&b.end){var now=new Date();return mins(b.end)<=now.getHours()*60+now.getMinutes();}return false;}
  function habitById(id){var l=state.habits||[];for(var i=0;i<l.length;i++){if(l[i].id===id)return l[i];}return null;}
  function habitOf(b){return b&&b.habitId?habitById(b.habitId):null;}
  function blockColor(b){var h=habitOf(b);return h?(h.color||"#ab2fed"):catColor(b.cat);}
  function weekBounds(){var s=startOfWeek(today);return {s:s,e:addDays(s,6)};}
  function weekDone(h){var wb=weekBounds(),n=0;for(var k in h.log){var d=parse(k);if(d>=wb.s&&d<=wb.e)n++;}return n;}
  function weekPct(h){var t=h.weeklyTarget||0;if(!t)return null;return Math.min(100,Math.round(weekDone(h)/t*100));}
  function linkedItems(str){
    var out=[];
    (state.blocks||[]).forEach(function(b){if(b.goalRef===str&&!b.habitId)out.push({title:b.title,color:blockColor(b),done:isBlockDone(b),typeLabel:"일정",meta:(b.allDay?"종일":(b.start?b.start+(b.end?"–"+b.end:""):""))+(b.date?" · "+md(b.date):"")});});
    (state.todos||[]).forEach(function(t){if(t.goalRef===str)out.push({title:t.title,color:catColor(t.cat),done:!!t.done,typeLabel:"할 일",meta:(t.start?"🕑"+t.start+" · ":"")+(t.date?md(t.date):"")+(t.done?" · 완료":isOverdue(t)?" · 지연":"")});});
    (state.habits||[]).forEach(function(h){if(h.goalRef===str){var t=h.weeklyTarget||0,wd=weekDone(h);out.push({title:h.name,color:h.color||"#ab2fed",done:!!h.log[ymd(today)],typeLabel:"습관",target:t,wdone:wd,meta:"🔥연속 "+streak(h)+"d"+(t?" · 이번 주 "+wd+"/"+t+"회":" · 이번달 "+monthRuns(h,parse(ymd(today)))+"회")+(h.sched&&h.sched.on?" · ⏱":"")});}});
    return out;
  }
  // 습관 ↔ 캘린더 시간블록 연동
  function syncHabitBlock(h){
    if(!h.sched||!h.sched.on){state.blocks=state.blocks.filter(function(b){return b.habitId!==h.id;});return;}
    if(h.sched.mode==="repeat"){
      state.blocks=state.blocks.filter(function(b){return b.habitId!==h.id;});
      var days=(h.sched.days&&h.sched.days.length)?h.sched.days:[0,1,2,3,4,5,6];
      state.blocks.push({id:uid(),habitId:h.id,date:ymd(today),endDate:"",allDay:false,start:h.sched.start||"20:00",end:h.sched.end||"21:00",title:h.name,memo:"습관 연동",cat:"",goalRef:h.goalRef||"",repeat:{freq:"weekly",days:days},notify:"off"});
    }else{
      // 수동: 반복 블록만 제거, 그날그날 단일 블록은 유지
      state.blocks=state.blocks.filter(function(b){return !(b.habitId===h.id&&b.repeat&&b.repeat.freq!=="none");});
    }
  }

  function renderGoal(){
    var NS="http://www.w3.org/2000/svg";
    var el=document.getElementById("goalSvg"); el.innerHTML="";
    var g=state.goal||defaultGoal();
    var T=[50,3],BL=[3,86],BR=[97,86];
    function mid(a,b){return [(a[0]+b[0])/2,(a[1]+b[1])/2];}
    function cen(p){return [(p[0][0]+p[1][0]+p[2][0])/3,(p[0][1]+p[1][1]+p[2][1])/3];}
    function sub(A,B,C){var ab=mid(A,B),bc=mid(B,C),ca=mid(C,A);return{corners:[[A,ab,ca],[ab,B,bc],[ca,bc,C]],center:[ab,bc,ca]};}
    var nodes=[], L1=sub(T,BL,BR);
    nodes.push({tri:L1.center,data:g.main,level:"main",ref:{kind:"main"}});
    L1.corners.forEach(function(cl,ci){
      var s=sub(cl[0],cl[1],cl[2]),sg=g.subs[ci];
      nodes.push({tri:s.center,data:sg,level:"sub",ref:{kind:"sub",ci:ci}});
      s.corners.forEach(function(tri,ai){nodes.push({tri:tri,data:sg.acts[ai],level:"act",ref:{kind:"act",ci:ci,ai:ai}});});
    });
    nodes.forEach(function(n){
      var poly=document.createElementNS(NS,"polygon");
      poly.setAttribute("points",n.tri.map(function(p){return p[0]+","+p[1];}).join(" "));
      poly.setAttribute("class","gtri "+n.level+(n.data.done?" done":"")+(refStr(n.ref)===ui.goalSel?" sel":""));
      poly.addEventListener("click",function(){ui.goalSel=refStr(n.ref);if(!n.data.t){openGoalSheet(n.ref);}renderGoal();});
      el.appendChild(poly);
      // 라벨 박스를 삼각형 안쪽(아래 넓은 쪽)에 맞춰 배치 — 실행 항목도 글자 표시
      if(n.level==="act"){
        // 실행 항목: SVG 텍스트(벡터)로 선명하게 1줄 · 길면 … 로 자름
        var cc=cen(n.tri);
        var raw=(n.data.t||""); var disp=(raw.length>6?raw.slice(0,5)+"…":raw);
        var tx=document.createElementNS(NS,"text");
        tx.setAttribute("x",cc[0]); tx.setAttribute("y",cc[1]+1.4);
        tx.setAttribute("text-anchor","middle"); tx.setAttribute("dominant-baseline","central");
        tx.setAttribute("class","gtext"+(n.data.done?" done":"")); tx.setAttribute("pointer-events","none");
        tx.textContent=disp;
        el.appendChild(tx);
      }else{
        var c=cen(n.tri);
        var w=(n.level==="main"?30:17), h=(n.level==="main"?20:14), oy=(n.level==="main"?0:-1);
        var fo=document.createElementNS(NS,"foreignObject");
        fo.setAttribute("x",c[0]-w/2); fo.setAttribute("y",c[1]-h/2+oy); fo.setAttribute("width",w); fo.setAttribute("height",h); fo.setAttribute("pointer-events","none");
        var div=document.createElement("div"); div.className="glabel "+n.level; div.innerHTML='<span>'+esc(n.data.t||"")+'</span>';
        fo.appendChild(div); el.appendChild(fo);
      }
    });
    renderGoalDetail();
    document.getElementById("viewTitle").textContent="Goal";
  }

      setSync("syncing");
      try{
        sb.from("app_state").upsert({user_id:supaUser.id,data:state,updated_at:new Date().toISOString()},{onConflict:"user_id"})
          .then(function(res){if(res&&res.error){onSyncFail(res.error.message);}else{pendingSync=false;clearTimeout(retryT);setSync("synced");}})
          .catch(function(e){onSyncFail(e&&e.message);});
      }catch(e){onSyncFail(e&&e.message);}
    }, now?0:1200);
  }
  function cloudPull(){
    if(!SUPA_ON||!supaUser)return;
    setSync("syncing");
    sb.from("app_state").select("data,updated_at").eq("user_id",supaUser.id).maybeSingle()
      .then(function(res){
        if(res.error){onSyncFail(res.error.message);return;}
        if(res.data&&res.data.data){state=migrateCloud(res.data.data);LS.setItem(K,JSON.stringify(state));refreshAll();pendingSync=false;setSync("synced");toast("클라우드에서 불러왔어요 ☁️");}
        else{setSync("synced");cloudPush(true);}
      }).catch(function(e){onSyncFail(e&&e.message);});
  }
  function applySession(session){
    if(session&&session.user){
      var u=session.user, m=u.user_metadata||{};
      supaUser={id:u.id,email:u.email,name:m.name||m.full_name||u.email};
      hideLogin();cloudPull();
    }else{supaUser=null;var ss=document.getElementById("syncStat");if(ss)ss.hidden=true;showLogin();}
  }
  function supaInit(){
    if(!SUPA_URL||!SUPA_ANON||!window.supabase)return false;
    try{sb=window.supabase.createClient(SUPA_URL,SUPA_ANON);SUPA_ON=true;return true;}catch(e){console.warn("supaInit",e);return false;}
  }
  if(supaInit()){
    sb.auth.onAuthStateChange(function(_e,session){applySession(session);});
    sb.auth.getSession().then(function(res){applySession(res.data?res.data.session:null);});
  }
  window.addEventListener("online",function(){if(SUPA_ON&&supaUser&&pendingSync)cloudPush(true);});
  window.addEventListener("offline",function(){if(SUPA_ON&&supaUser)setSync("offline");});

  // ---------- 실제 알림 스케줄러 (앱 켜져 있을 때 설정 시각에 알림) ----------
  function dueAlarms(){
    var out=[], td=ymd(new Date());
    blocksOn(td).forEach(function(b){if(b.notify&&b.notify!=="off"&&!b.allDay&&b.start)out.push({key:"ev:"+b.id+":"+td,min:mins(b.start),kind:"event",title:b.title,sub:b.start,rep:repeatLabel(b)});});
    state.todos.forEach(function(t){if(!t.done&&t.notify&&t.notify!=="off"&&todoOnDay(t,td)&&t.start)out.push({key:"td:"+t.id+":"+td,min:mins(t.start),kind:"todo",title:t.title,sub:t.start,rep:""});});
    state.habits.forEach(function(h){if(h.alarm&&h.alarm.on&&h.alarm.time&&!h.log[td])out.push({key:"hb:"+h.id+":"+td,min:mins(h.alarm.time),kind:"habit",title:h.name,sub:"습관 시간",rep:""});});
    return out;
  }
  var firedKeys={}, lastMin=(new Date()).getHours()*60+(new Date()).getMinutes();
  function alarmTick(){
    var nowMin=(new Date()).getHours()*60+(new Date()).getMinutes();
    if(nowMin<lastMin){firedKeys={};lastMin=nowMin;return;} // 자정/시각 되감김 안전장치
    dueAlarms().forEach(function(a){
      if(a.min>lastMin&&a.min<=nowMin&&!firedKeys[a.key]){
        firedKeys[a.key]=1;
        showNotif(a.kind,a.title,a.sub,a.rep);
        if(state.readAlerts){delete state.readAlerts[a.key];}
        updateBadge();
      }
    });
    lastMin=nowMin;
  }
  setInterval(alarmTick,20000);
})();
</script>
